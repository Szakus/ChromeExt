<!DOCTYPE html>
<html>
<body>
<canvas id="c16" width="16" height="16"></canvas>
<canvas id="c48" width="48" height="48"></canvas>
<script>
function draw(canvas) {
  const s = canvas.width;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#e94560";
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, s * 0.2);
  ctx.fill();

  ctx.fillStyle = "#fff";
  const pad = s * 0.15;
  const lineH = s * 0.12;
  const gap = s * 0.06;
  const w = s - pad * 2;
  [0, 1, 2].forEach(i => {
    const y = pad + i * (lineH + gap);
    const thisW = i === 2 ? w * 0.6 : w;
    ctx.fillRect(pad, y, thisW, lineH);
  });

  // X mark
  ctx.strokeStyle = "#e94560";
  ctx.lineWidth = s * 0.1;
  ctx.lineCap = "round";
  const cx = s * 0.68, cy = s * 0.68, r = s * 0.2;
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx - r * 0.5, cy - r * 0.5);
  ctx.lineTo(cx + r * 0.5, cy + r * 0.5);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + r * 0.5, cy - r * 0.5);
  ctx.lineTo(cx - r * 0.5, cy + r * 0.5);
  ctx.stroke();
}

["c16","c48"].forEach(id => draw(document.getElementById(id)));

// output data URLs to download
document.querySelectorAll("canvas").forEach(c => {
  const a = document.createElement("a");
  a.download = `icon${c.width}.png`;
  a.href = c.toDataURL();
  a.textContent = `Download icon${c.width}.png`;
  a.style.display = "block";
  document.body.appendChild(a);
});
</script>
</body>
</html>
