<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; width: 280px; background: #1a1a2e; color: #e0e0e0; }

    .header {
      background: #16213e;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #0f3460;
    }
    .header h1 { font-size: 15px; font-weight: 600; color: #fff; }

    .toggle-wrap { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .toggle { position: relative; width: 36px; height: 20px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; background: #444; border-radius: 20px; cursor: pointer;
      transition: .2s;
    }
    .slider:before {
      content: ""; position: absolute; width: 14px; height: 14px;
      left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s;
    }
    input:checked + .slider { background: #e94560; }
    input:checked + .slider:before { transform: translateX(16px); }

    .info {
      padding: 14px 16px;
      font-size: 12px;
      color: #888;
      line-height: 1.6;
      border-bottom: 1px solid #0f3460;
    }
    .info b { color: #e0e0e0; }

    .stats { padding: 10px 16px; font-size: 12px; color: #888; display: flex; justify-content: space-between; }
    .stats b { color: #e0e0e0; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Tab to End</h1>
    <div class="toggle-wrap">
      <span id="status-label">ON</span>
      <label class="toggle">
        <input type="checkbox" id="enabled">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="info">
    When enabled, tabs opened from <b>pinned tabs</b> (Ctrl+click or middle-click) are automatically moved to the <b>end</b> of the tab strip.
  </div>

  <div class="stats">
    <span>Open tabs: <b id="tab-count">-</b></span>
    <span>Pinned tabs: <b id="pinned-count">-</b></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
